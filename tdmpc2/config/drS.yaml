defaults:
    - tdmpc2
    - _self_

# environment
seed: 1
task: peg-insertion-semi
obs: state
num_envs: 16

# evaluation
checkpoint: ???
eval_episodes: 10
eval_freq: 2000

# training
steps: 4_000_000
batch_size: 256
steps_per_update: 4 # utd = steps_per_update / num_envs (in this implementation)
buffer_size: 300_000
exp_name: default
save_freq: 500_000
oversample_ratio: 0.5 # 0.5, 0.0
policy_pretraining: true
use_demos: ???
seed_scheduler: false
demo_success_only: false

# pretraining
pretrain:
    n_epochs: 100000
    eval_freq: 5000
    log_freq: 500

# logging
wandb_project: maniskill3
wandb_entity: alopez
wandb_silent: true
disable_wandb: true
save_csv: false

# drS
drS_enable: true
n_stages: ???
demo_path: /hdd/adria/demo_data/Maniskill3/state/tdmpc/PegInsertionSide_200.pkl
drS_discriminator:
    disc_lr: 3e-4
    batch_size: 256
n_demos: 10
